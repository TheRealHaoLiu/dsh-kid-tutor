# dsh-kid-tutor bundle patch — HOST-PLANE rows only.
#
# Per docs/dsh-seams.md §0.1 / §1b, a bundle's cordis.patch.yml only reaches
# the host Loader tree, which the `web` profile's per-session agent preset
# does NOT see. Everything model-facing for this bundle (persona, tool
# roster, guard/quota/fence plugins) lives in presets/kid/agent.cordis.yml
# instead. The one thing that genuinely belongs at the host plane is enabling
# the `web_fetch` HTTP provider, because `@deepseek-ai/dsh-web` (the seam
# `tool-web` calls into) and its search provider are host-plane services
# (packages/bundle/base/cordis.patch.yml `id: web` / `id: web-search-deepseek`)
# that a preset cannot mount — only the model-facing `tool-web` row is
# preset-level (docs/dsh-seams.md §3, "the web service and its search
# provider stay in the host composition").
#
# `@deepseek-ai/dsh-web-fetch-http` is NOT mounted by any shipped bundle
# (packages/bundle/base/cordis.patch.yml: "Fetch stays disabled and no fetch
# provider is mounted: that provider defers SSRF protection and the model
# would choose the request target"). Its own README says outright it "is an
# SSRF primitive and must not be enabled in a deployment that can reach
# sensitive internal network targets" — which is exactly why
# `dsh-kid-tutor/tool-policy` (mounted in the preset) enforces a domain
# allowlist plus a literal-IP/RFC1918/loopback/.local/.lan/.home/.internal
# hostname guard on every `web_fetch` call via `ctx.tools.guard()`, in
# addition to this row. Treat "this row is mounted" as equivalent to
# "SSRF-reachable unless the allowlist guard is also loaded" — do not ship
# this bundle without `dsh-kid-tutor/tool-policy` in the preset.
- insert:
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

# `kid-ui` — the knob-free kid front end (docs/dsh-seams.md §8 / DESIGN.md §8
# "Decided" reversal). Host-plane because it needs `ctx.webServer` (the same
# `@deepseek-ai/dsh-host-webserver` instance `@deepseek-ai/dsh-web-app`
# serves the stock chat UI from) and `ctx.apiProxy` (the same gateway the
# stock UI's `/api/*` routes wrap), both of which only exist on the host
# Loader tree — a preset row cannot see either. `inject: ['webServer',
# 'apiProxy']` on the plugin itself (not restated here) makes the Loader wait
# for `@deepseek-ai/dsh-web-app`'s rows regardless of `dsh.profile.bundles`
# order, so this bundle does not need to sit after it in that list, though it
# already does (profiles/kid/package.json).
#
# `presetId: kid` and `workspaceRoot` are server-side facts a browser can
# never override (`kid-ui.ts`'s `/kid/session` route strips every other field
# from the client body) — see DESIGN.md §8 and the module's own doc comment.
# `path: '/'` claims the SAME exact webserver path the stock frontend's
# fallback would otherwise answer with the knobby chat UI; an exact-route hit
# is checked before the fallback seat regardless of load order
# (`@deepseek-ai/dsh-host-webserver`'s `WebServer.match()`), so the stock UI
# needed no disabling and no edit to profiles/kid/cordis.patch.yml or
# presets/kid/agent.cordis.yml was necessary for this row to work.
- insert:
    - id: kid-ui
      name: 'dsh-kid-tutor/kid-ui'
      config:
        enabled: true
        path: '/'
        presetId: kid
